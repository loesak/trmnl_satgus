name: Fetch Satellite Position

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-position:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install Poetry
      run: |
        python -m pip install --user pipx
        pipx install poetry

    - name: Install dependencies
      run: poetry install
      working-directory: trmnl_satgus

    - name: Fetch satellite position data
      run: poetry run python satgus/calculate_position.py
      working-directory: trmnl_satgus

    - name: Render map image
      run: poetry run python satgus/render_map.py ../_site
      working-directory: trmnl_satgus

    - name: Upload map for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    # Deploy before committing the position so map_url never points at a stale map
    - name: Deploy map to GitHub Pages
      id: deploy-pages
      uses: actions/deploy-pages@v4

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add trmnl_data/satgus_position.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update satellite position [skip ci]"
        git push origin HEAD:${{ github.ref }}
